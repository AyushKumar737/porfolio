  <style>
    /* Custom Alert Box Styles */
    .custom-alert-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .custom-alert-box {
      background: #fff;
      border-radius: 10px;
      padding: 20px 30px;
      max-width: 400px;
      text-align: center;
      transform: scale(0.7);
      transition: all 0.3s ease;
    }

    .custom-alert-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .custom-alert-box.active {
      transform: scale(1);
    }

    .custom-alert-header {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .custom-alert-message {
      font-size: 1.1em;
      margin-bottom: 20px;
    }

    .custom-alert-button {
      background: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
    }

    .custom-alert-button:hover {
      background: #45a049;
    }
  </style>
</head>

  <!-- Custom Alert Box Structure -->

  <script>
    function myFunction() {
      let person = document.getElementById("name").value;
      let text;

      if (person === "") {
        text = "Please enter your name.";
      } else {
        text = "Hello " + person + "! Your message has been sent. Thank you for contacting Ayush Kumar. Ayush Kumar Will respond to you as soon as possible!";
      }

      // Show the message in a custom alert box
      document.getElementById("customAlertMessage").innerText = text;
      document.getElementById("customAlert").classList.add("active");

    }

    function closeCustomAlert() {
      document.getElementById("customAlert").classList.remove("active");
    }
  </script>
